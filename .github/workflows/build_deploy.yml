name: build_deploy

on:
  push:
    branches: [ main ]
  pull_request:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Use Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: 3.3

      - name: Cache aggregate state
        uses: actions/cache@v4
        with:
          path: .cache/aggregate
          key: mn-aggregate-${{ github.run_id }}
          restore-keys: mn-aggregate-

      - name: Build site (fetch releases + Jekyll)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec rake build

      - name: Verify build
        run: |
          doc_count=$(python3 -c "import json; print(len(json.load(open('_data/documents.json')).get('items',[])))")
          if [ "$doc_count" -eq 0 ]; then
            echo "::error::Build produced 0 documents — aborting deploy"
            exit 1
          fi
          echo "Verified: $doc_count documents"

      - name: Debug
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          ls -al _site
          ls _site/docs | head -20
          ls _site/relaton 2>/dev/null || echo "(no relaton dir)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
