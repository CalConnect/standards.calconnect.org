name: build_deploy

on:
  push:
    branches: [ main ]
  pull_request:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  #
  # For each document category, build using `metanorma site generate`.
  #
  build-docs:
    name: Build ${{ matrix.doc_type }} docs
    runs-on: ubuntu-latest
    container:
      image: metanorma/metanorma:latest
    strategy:
      matrix:
        doc_type:
          - administrative
          - directive
          - pending-publication
          - public-review
          - report
          - specification
          - standard
          - advisory
          - amendment
          - guide
          - technical-corrigendum
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1
      - name: Calculate cache key
        id: cache-key
        run: |
          echo "cache-key=$(scripts/metacachekey metanorma src-documents/metanorma-${{ matrix.doc_type }}.yml)" >> $GITHUB_OUTPUT
      - name: Restore cache
        id: cache
        uses: actions/cache@v4
        with:
          path: _site/${{ matrix.doc_type }}
          key: ${{ steps.cache-key.outputs.cache-key }}
      - name: Metanorma generate site
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          metanorma site generate \
            -o _site/${{ matrix.doc_type }} \
            -c src-documents/metanorma-${{ matrix.doc_type }}.yml \
            --agree-to-terms \
            --no-progress
      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metanorma-docs-${{ matrix.doc_type }}
          path: _site/${{ matrix.doc_type }}

  #
  # Assemble artifacts, build Relaton index, build Jekyll site.
  #
  build-site:
    name: Build site
    runs-on: ubuntu-latest
    needs: [build-docs]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all doc artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "metanorma-docs-*"
          path: _site
          merge-multiple: false

      - name: Fix doc artifacts paths
        shell: bash
        run: |
          for dir in _site/metanorma-docs-*; do
            [ -d "$dir" ] && mv "$dir" "${dir/metanorma-docs-}"
          done

      - name: Canonicalize artifact paths
        shell: bash
        run: |
          for doc_type in administrative directive pending-publication public-review report specification standard advisory amendment guide technical-corrigendum; do
            PUBLIC_PATH=cc SITE_SUB_DIR=$doc_type scripts/canonicalize-document-paths || true
          done
          touch _site/cc/.canonicalized

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Use Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: 3.3

      - name: Build Relaton index
        run: bundle exec rake relaton:build

      - name: Build Jekyll site
        run: bundle exec rake jekyll

      - name: Debug
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          ls -al _site
          ls _site/cc | head -20
          ls _site/relaton

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  #
  # Deploy to GitHub Pages
  #
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build-site
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
