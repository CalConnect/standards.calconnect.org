# Instance configuration for the CalConnect Standards Registry.
#
# Consumed by the shared registry engine (Registry::Config reads the
# `registry:` map; this filename is the engine's default site_config_path)
# and by the Astro frontend (src/lib/registry.ts). Everything an instance
# customizes lives here or in metanorma.aggregate.yml — never in code.
title: CalConnect Document Registry
author: CalConnect TC PUBLISH
email: tc-publish@calconnect.org
description: >-
  The CalConnect Document Registry
url: "https://standards.calconnect.org"

registry:
  org: calconnect
  publisher_name: CalConnect
  urn_namespace: calconnect
  url_scheme: "/docs/:document_id/:year/"
  docs_prefix: "/docs"
  legacy_prefixes: ["cc"]
  features:
    search: true
    atom_feed: true
    jsonld: true
    opensearch: true
    html: true
  # Rights statement for documents whose Relaton record carries no
  # license (per https://www.calconnect.org/about/policies/copyright-and-licensing/)
  license_default:
    name: "© CalConnect — all rights reserved"
    url: "https://www.calconnect.org/about/policies/copyright-and-licensing/"
