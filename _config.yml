title: CalConnect Document Registry
author: CalConnect TC PUBLISH
email: tc-publish@calconnect.org
description: >-
  The CalConnect Document Registry
baseurl: ""
url: "https://standards.calconnect.org"
twitter_username: calconnect
github_username:  CalConnect

markdown: kramdown
theme: jekyll-calconnect-theme
plugins:
  - jekyll/vite

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

keep_files:
  - docs

# Registry instance configuration (TODO.improvements/11): identity,
# URL scheme and feature flags consumed by the shared registry engine
# (lib/registry) and the reference renderer. Everything an instance
# customizes lives here or in metanorma.aggregate.yml — never in code.
registry:
  org: calconnect
  urn_namespace: calconnect
  url_scheme: "/docs/:document_id/:year/"
  docs_prefix: "/docs"
  legacy_prefixes: ["cc"]
  features:
    search: true
    atom_feed: true
    jsonld: true
    opensearch: true
    html: true
  license_default: null

exclude:
  - README.adoc
  - Makefile
  - flake.*
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - "*.raw.rxl"
  - src-documents/
  - _archive/
  - spec/
  - lib/
  - bin/
  - fixtures/
  - tools/
  - .tmp/
  - _data/schemas/
  - scripts/
  - config
  - vite.config.ts
  - package.json
  - package-lock.json
  - postcss.config.js
  - Rakefile
  - metanorma.aggregate.yml
  - registry
  - docs/evidence
  - relaton.Gemfile
  - relaton.Gemfile.lock
  - BUGS.md
  - CLAUDE.md
  - TODO.doc-release-workflow
  - TODO.improvements
  - .envrc
  - .gitmodules

pagination:
  collection: 'posts'
  per_page: 30
  permalink: '/page/:num/'
  title: ':title - page :num'
  sort_field: 'date'
  sort_reverse: true
  category: 'posts'
  tag: ''
  locale: ''
  extension: html
  indexpage: 'index'
